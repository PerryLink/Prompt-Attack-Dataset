[tool.poetry]
name = "prompt-attack-dataset"
version = "0.1.0"
description = "开箱即用的 LLM Prompt Injection 攻击测试集"
authors = ["Chance Dean <novelnexusai@outlook.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/PerryLink/prompt-attack-dataset"
repository = "https://github.com/PerryLink/prompt-attack-dataset"
keywords = ["llm", "security", "prompt-injection", "red-team", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "prompt_attack_dataset", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
typer = "^0.12.0"
rich = "^13.7.0"
openai = "^1.12.0"
anthropic = "^0.18.0"
pydantic = "^2.6.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.1.0"
ruff = "^0.2.0"
mypy = "^1.8.0"

[tool.poetry.scripts]
prompt-attack-dataset = "prompt_attack_dataset.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/prompt_attack_dataset --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
